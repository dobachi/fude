[package]
name = "fude-cli"
version = "0.8.5"
description = "Fude without a window: the remote-GUI agent (and, later, the terminal UI)"
edition = "2021"
publish = false

[[bin]]
name = "fude-cli"
path = "src/main.rs"

[dependencies]
fude-core = { path = "../fude-core" }
serde_json = "1"
interprocess = "2.4"
notify = "8"
dirs = "5"
ratatui = "0.30"
comrak = { version = "0.56", default-features = false }
unicode-width = "0.2"
edtui = { version = "0.11", default-features = false }

[dev-dependencies]
tempfile = "3"
