[package]
name = "fude-core"
version = "0.1.0"
description = "Fude logic shared by the desktop app, the CLI agent and the TUI (no Tauri)"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
trash = "5"
interprocess = "2.4"

[dev-dependencies]
tempfile = "3"
